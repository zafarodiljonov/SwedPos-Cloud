name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Tashkent
    steps:
      # The desktop repository is private: add a read-only token with access to it as the secret SWEDPOS_REPO_TOKEN.
      - uses: actions/checkout@v4
        with:
          submodules: true
          token: ${{ secrets.SWEDPOS_REPO_TOKEN }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet restore
      - run: dotnet build --configuration Release --no-restore
      - run: dotnet test --configuration Release --no-build
